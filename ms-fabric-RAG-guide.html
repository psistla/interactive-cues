<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise RAG in Microsoft Fabric — Interactive Project Guide</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <style>
        /* ═══════════════════════════════════════════════════
           MERIDIAN DESIGN SYSTEM — LIGHT THEME
           ═══════════════════════════════════════════════════ */
        :root {
            --m-bg: #FFFFFF;
            --m-surface: #F8F9FA;
            --m-border: #E9ECEF;
            --m-border-subtle: #F1F3F5;
            --m-text: #212529;
            --m-text-secondary: #495057;
            --m-text-tertiary: #868E96;
            --m-primary-50: #EEF2FF;
            --m-primary-100: #E0E7FF;
            --m-primary-200: #C7D2FE;
            --m-primary-400: #818CF8;
            --m-primary-500: #6366F1;
            --m-primary-600: #4F46E5;
            --m-primary-700: #4338CA;
            --m-primary-800: #3730A3;
            --m-primary-900: #312E81;
            --m-accent-50: #FFFBEB;
            --m-accent-100: #FEF3C7;
            --m-accent-400: #FBBF24;
            --m-accent-500: #F59E0B;
            --m-accent-700: #B45309;
            --m-accent-800: #92400E;
            --m-neutral-100: #F1F3F5;
            --m-neutral-200: #E9ECEF;
            --m-neutral-300: #DEE2E6;
            --m-neutral-700: #343A40;
            --m-neutral-800: #212529;
            --m-neutral-900: #16191D;
            --m-neutral-950: #0D0F12;
            --m-success: #15803D;
            --m-success-bg: #F0FDF4;
            --m-warning: #EA580C;
            --m-warning-bg: #FFF7ED;
            --m-error: #DC2626;
            --m-error-bg: #FEF2F2;
            --m-info: #2563EB;
            --m-info-bg: #EFF6FF;
            --m-font-primary: 'Manrope', system-ui, sans-serif;
            --m-font-code: 'JetBrains Mono', monospace;
            --m-radius-sm: 4px;
            --m-radius-md: 8px;
            --m-radius-lg: 12px;
            --m-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --m-shadow-md: 0 2px 8px rgba(0,0,0,0.06);
            --m-shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
            --m-transition-fast: 120ms ease;
            --m-transition-base: 200ms ease;
        }

        /* ─── DARK MODE ─────────────────────────────── */
        .dark {
            --m-bg: #0D0F12;
            --m-surface: #16191D;
            --m-border: #343A40;
            --m-border-subtle: #212529;
            --m-text: #E9ECEF;
            --m-text-secondary: #ADB5BD;
            --m-text-tertiary: #868E96;
            --m-primary-50: rgba(79, 70, 229, 0.1);
            --m-primary-100: rgba(79, 70, 229, 0.15);
            --m-primary-200: rgba(129, 140, 248, 0.2);
            --m-primary-600: #818CF8;
            --m-primary-700: #A5B4FC;
            --m-primary-800: #C7D2FE;
            --m-primary-900: #E0E7FF;
            --m-accent-50: rgba(251, 191, 36, 0.08);
            --m-accent-700: #FBBF24;
            --m-accent-800: #FCD34D;
            --m-neutral-200: #343A40;
            --m-neutral-300: #495057;
            --m-neutral-700: #868E96;
            --m-neutral-800: #E9ECEF;
            --m-neutral-900: #F1F3F5;
            --m-neutral-950: #0D0F12;
            --m-success: #4ade80;
            --m-success-bg: rgba(21, 128, 61, 0.12);
            --m-warning: #fb923c;
            --m-warning-bg: rgba(234, 136, 12, 0.1);
            --m-error: #f87171;
            --m-error-bg: rgba(220, 38, 38, 0.1);
            --m-info: #60a5fa;
            --m-info-bg: rgba(37, 99, 235, 0.1);
            --m-shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --m-shadow-md: 0 2px 8px rgba(0,0,0,0.3);
            --m-shadow-lg: 0 4px 16px rgba(0,0,0,0.4);
            color-scheme: dark;
        }

        .dark ::selection {
            background: #3730A3;
            color: #E0E7FF;
        }

        .dark .code-block {
            background: #0a0c0f;
            border: 1px solid #343A40;
        }

        .dark .verify-gate {
            border-color: rgba(74, 222, 128, 0.2);
        }

        .dark .verify-checkbox {
            background: #16191D;
            border-color: #495057;
        }

        .dark .pattern-card.selected {
            background: rgba(79, 70, 229, 0.1);
        }

        .dark .step-card {
            background: #16191D;
        }

        .dark .nav-item:hover {
            background: #212529;
        }

        .dark .nav-item.active {
            background: rgba(79, 70, 229, 0.1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--m-font-primary);
            font-size: 15px;
            line-height: 1.6;
            color: var(--m-text);
            background: var(--m-bg);
        }

        /* ═══════════════════════════════════════════════════
           LAYOUT
           ═══════════════════════════════════════════════════ */
        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        /* ─── SIDEBAR ─────────────────────────────────── */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--m-surface);
            border-right: 1px solid var(--m-border);
            padding: 24px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--m-border);
            margin-bottom: 16px;
        }

        .sidebar-header h1 {
            font-size: 15px;
            font-weight: 700;
            color: var(--m-primary-800);
            letter-spacing: -0.015em;
            line-height: 1.3;
        }

        .sidebar-header .subtitle {
            font-size: 11px;
            color: var(--m-text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 600;
            margin-top: 4px;
        }

        .progress-summary {
            padding: 12px 20px;
            border-bottom: 1px solid var(--m-border);
            margin-bottom: 12px;
        }

        .progress-bar-container {
            height: 6px;
            background: var(--m-neutral-200);
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--m-primary-600), var(--m-primary-400));
            border-radius: 9999px;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 11px;
            color: var(--m-text-tertiary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .progress-count {
            font-size: 13px;
            font-weight: 700;
            color: var(--m-primary-600);
            margin-top: 2px;
        }

        .nav-section {
            padding: 0 12px;
        }

        .nav-phase {
            font-size: 11px;
            font-weight: 600;
            color: var(--m-text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 8px 8px 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: var(--m-radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--m-text-secondary);
            transition: all var(--m-transition-fast);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background: var(--m-neutral-200); color: var(--m-text); }
        .nav-item.active { background: var(--m-primary-50); color: var(--m-primary-700); font-weight: 600; }
        .nav-item.completed .nav-check { color: var(--m-success); }

        .nav-check {
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            border: 2px solid var(--m-neutral-300);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex-shrink: 0;
            transition: all var(--m-transition-fast);
        }

        .nav-item.completed .nav-check {
            border-color: var(--m-success);
            background: var(--m-success-bg);
        }

        /* ─── MAIN CONTENT ────────────────────────────── */
        .main-content {
            flex: 1;
            max-width: 860px;
            padding: 40px 48px;
        }

        /* ─── TYPOGRAPHY ──────────────────────────────── */
        .page-title {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--m-text);
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 15px;
            color: var(--m-text-secondary);
            margin-bottom: 32px;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: var(--m-text);
            margin: 32px 0 12px;
        }

        h3 {
            font-size: 17px;
            font-weight: 600;
            color: var(--m-text);
            margin: 24px 0 8px;
        }

        p { margin-bottom: 12px; }

        /* ─── PHASE SECTIONS ──────────────────────────── */
        .phase-section {
            display: none;
        }

        .phase-section.active {
            display: block;
        }

        .phase-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 4px 10px;
            border-radius: 9999px;
            margin-bottom: 8px;
        }

        .phase-badge.p0 { background: var(--m-neutral-100); color: var(--m-text-secondary); }
        .phase-badge.p1 { background: var(--m-primary-50); color: var(--m-primary-700); }
        .phase-badge.p2 { background: var(--m-accent-50); color: var(--m-accent-700); }
        .phase-badge.p3 { background: var(--m-info-bg); color: var(--m-info); }
        .phase-badge.p4 { background: var(--m-success-bg); color: var(--m-success); }
        .phase-badge.p5 { background: var(--m-warning-bg); color: var(--m-warning); }
        .phase-badge.p6 { background: var(--m-error-bg); color: var(--m-error); }

        /* ─── STEP CARDS ──────────────────────────────── */
        .step-card {
            background: var(--m-bg);
            border: 1px solid var(--m-border);
            border-radius: var(--m-radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            transition: box-shadow var(--m-transition-base);
        }

        .step-card:hover { box-shadow: var(--m-shadow-md); }

        .step-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .step-number {
            width: 28px;
            height: 28px;
            border-radius: 9999px;
            background: var(--m-primary-50);
            color: var(--m-primary-600);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .step-card.completed .step-number {
            background: var(--m-success-bg);
            color: var(--m-success);
        }

        .step-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--m-text);
            flex: 1;
        }

        .step-chevron {
            color: var(--m-text-tertiary);
            transition: transform var(--m-transition-fast);
            font-size: 14px;
            margin-top: 4px;
        }

        .step-card.expanded .step-chevron { transform: rotate(90deg); }

        .step-body {
            display: none;
            margin-top: 16px;
            padding-left: 40px;
        }

        .step-card.expanded .step-body { display: block; }

        .step-actions {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--m-border-subtle);
            display: flex;
            gap: 8px;
        }

        /* ─── CODE BLOCKS ─────────────────────────────── */
        .code-block {
            background: var(--m-neutral-950);
            color: #E9ECEF;
            border-radius: var(--m-radius-md);
            padding: 16px;
            font-family: var(--m-font-code);
            font-size: 13px;
            line-height: 1.5;
            overflow-x: auto;
            margin: 12px 0;
            position: relative;
        }

        .code-block .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #ADB5BD;
            font-size: 11px;
            font-family: var(--m-font-primary);
            font-weight: 600;
            padding: 4px 8px;
            border-radius: var(--m-radius-sm);
            cursor: pointer;
            transition: all var(--m-transition-fast);
        }

        .code-block .copy-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
        .code-block .copy-btn.copied { color: #4ade80; }

        .code-block .kw { color: #818CF8; }
        .code-block .str { color: #4ade80; }
        .code-block .cmt { color: #868E96; font-style: italic; }
        .code-block .fn { color: #FBBF24; }

        /* ─── CALLOUT BOXES ───────────────────────────── */
        .callout {
            border-left: 3px solid;
            border-radius: 0 var(--m-radius-md) var(--m-radius-md) 0;
            padding: 12px 16px;
            margin: 12px 0;
            font-size: 14px;
        }

        .callout-title {
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .callout.info { border-color: var(--m-info); background: var(--m-info-bg); }
        .callout.info .callout-title { color: var(--m-info); }
        .callout.warning { border-color: var(--m-warning); background: var(--m-warning-bg); }
        .callout.warning .callout-title { color: var(--m-warning); }
        .callout.critical { border-color: var(--m-error); background: var(--m-error-bg); }
        .callout.critical .callout-title { color: var(--m-error); }
        .callout.success { border-color: var(--m-success); background: var(--m-success-bg); }
        .callout.success .callout-title { color: var(--m-success); }

        /* ─── VERIFY GATE ─────────────────────────────── */
        .verify-gate {
            background: var(--m-success-bg);
            border: 1px solid rgba(21, 128, 61, 0.2);
            border-radius: var(--m-radius-lg);
            padding: 16px 20px;
            margin: 20px 0;
        }

        .verify-gate-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--m-success);
            margin-bottom: 8px;
        }

        .verify-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 14px;
        }

        .verify-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--m-neutral-300);
            border-radius: var(--m-radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--m-transition-fast);
            flex-shrink: 0;
            background: var(--m-bg);
        }

        .verify-checkbox.checked {
            background: var(--m-success);
            border-color: var(--m-success);
            color: white;
            font-size: 11px;
        }

        /* ─── DECISION TABLE ──────────────────────────── */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 14px;
        }

        th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 600;
            color: var(--m-text-secondary);
            padding: 8px 12px;
            border-bottom: 2px solid var(--m-border);
            background: var(--m-surface);
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--m-border-subtle);
            color: var(--m-text);
        }

        tr:hover td { background: var(--m-surface); }

        /* ─── BUTTONS ─────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: var(--m-radius-md);
            font-size: 13px;
            font-weight: 600;
            font-family: var(--m-font-primary);
            cursor: pointer;
            transition: all var(--m-transition-fast);
            border: 1px solid;
            min-height: 32px;
        }

        .btn-primary {
            background: var(--m-primary-600);
            color: white;
            border-color: var(--m-primary-600);
        }

        .btn-primary:hover { background: var(--m-primary-700); border-color: var(--m-primary-700); }

        .btn-outline {
            background: var(--m-bg);
            color: var(--m-text-secondary);
            border-color: var(--m-border);
        }

        .btn-outline:hover { background: var(--m-surface); color: var(--m-text); }

        .btn-success {
            background: var(--m-success);
            color: white;
            border-color: var(--m-success);
        }

        /* ─── PATTERN SELECTOR ────────────────────────── */
        .pattern-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 16px 0;
        }

        .pattern-card {
            border: 2px solid var(--m-border);
            border-radius: var(--m-radius-lg);
            padding: 16px;
            cursor: pointer;
            transition: all var(--m-transition-base);
        }

        .pattern-card:hover { border-color: var(--m-primary-200); box-shadow: var(--m-shadow-md); }
        .pattern-card.selected { border-color: var(--m-primary-600); background: var(--m-primary-50); }

        .pattern-card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--m-text);
            margin-bottom: 4px;
        }

        .pattern-card-desc {
            font-size: 13px;
            color: var(--m-text-secondary);
            line-height: 1.4;
        }

        .pattern-card-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 2px 8px;
            border-radius: 9999px;
            margin-bottom: 8px;
        }

        .badge-ga { background: var(--m-success-bg); color: var(--m-success); }
        .badge-preview { background: var(--m-warning-bg); color: var(--m-warning); }
        .badge-recommended { background: var(--m-primary-50); color: var(--m-primary-700); }

        /* ─── METRIC CARDS ────────────────────────────── */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0;
        }

        .metric-card {
            background: var(--m-surface);
            border-radius: var(--m-radius-lg);
            padding: 16px;
            text-align: center;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--m-primary-600);
        }

        .metric-value.accent { color: var(--m-accent-700); }
        .metric-value.success { color: var(--m-success); }

        .metric-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 600;
            color: var(--m-text-tertiary);
            margin-top: 4px;
        }

        /* ─── FLOW DIAGRAM ────────────────────────────── */
        .flow-diagram {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin: 16px 0;
            padding: 16px;
            background: var(--m-surface);
            border-radius: var(--m-radius-lg);
        }

        .flow-node {
            padding: 8px 14px;
            border-radius: var(--m-radius-md);
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--m-border);
            background: var(--m-bg);
        }

        .flow-node.highlight {
            border-color: var(--m-primary-600);
            background: var(--m-primary-50);
            color: var(--m-primary-700);
        }

        .flow-node.accent-node {
            border-color: var(--m-accent-700);
            background: var(--m-accent-50);
            color: var(--m-accent-800);
        }

        .flow-arrow { color: var(--m-text-tertiary); font-size: 16px; }

        /* ─── RESPONSIVE ──────────────────────────────── */
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main-content { padding: 24px 20px; }
            .pattern-cards, .metrics-row { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        :focus-visible {
            outline: 2px solid var(--m-primary-600);
            outline-offset: 2px;
            border-radius: inherit;
        }

        ::selection {
            background: var(--m-primary-100);
            color: var(--m-primary-900);
        }

        ul { list-style: none; padding-left: 0; }
        ul li { padding: 3px 0 3px 20px; position: relative; font-size: 14px; }
        ul li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 11px;
            width: 6px;
            height: 6px;
            border-radius: 9999px;
            background: var(--m-primary-400);
        }
        /* ─── THEME TOGGLE ─────────────────────────── */
        .theme-toggle-wrap {
            padding: 12px 20px;
            border-top: 1px solid var(--m-border);
            margin-top: auto;
        }

        .theme-toggle-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--m-border);
            border-radius: var(--m-radius-md);
            background: var(--m-bg);
            color: var(--m-text-secondary);
            font-family: var(--m-font-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--m-transition-fast);

                        <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Copy</button><span class="cmt"># Create metadata table in Notebook 01</span>

                        content: `<p>512-token chunks with 25% overlap and sentence boundary preservation. This is the optimal configuration per Microsoft benchmarking.</p>
                        <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Copy</button><span class="cmt"># Notebook 01 — Chunking pipeline</span>
<span class="kw">from</span> synapse.ml.featurize.text <span class="kw">import</span> PageSplitter
<span class="kw">from</span> pyspark.sql <span class="kw">import</span> functions <span class="kw">as</span> F

    // ═══════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════
    let state = {
        activeSection: 'p0-pattern',
        completedSteps: new Set(),
        checkedItems: new Set(),
        selectedPattern: null,
    };

    // Load from localStorage
    try {
        const saved = localStorage.getItem('rag-project-state');
        if (saved) {
            const parsed = JSON.parse(saved);
            state.completedSteps = new Set(parsed.completedSteps || []);
            state.checkedItems = new Set(parsed.checkedItems || []);
            state.selectedPattern = parsed.selectedPattern || null;
        }
    } catch(e) {}

    function saveState() {
        try {
            localStorage.setItem('rag-project-state', JSON.stringify({
                completedSteps: [...state.completedSteps],
                checkedItems: [...state.checkedItems],
                selectedPattern: state.selectedPattern,
            }));
        } catch(e) {}
    }

    // ═══════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════
    function getAllSections() {
        return PROJECT_DATA.phases.flatMap(p => p.sections);
    }

    function renderNav() {
        const nav = document.getElementById('navSection');
        nav.innerHTML = PROJECT_DATA.phases.map(phase => {
            const items = phase.sections.map(s => {
                const isActive = s.id === state.activeSection;
                const isCompleted = state.completedSteps.has(s.id);
                return `<button class="nav-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}"
                            onclick="navigateTo('${s.id}')">
                    <span class="nav-check">${isCompleted ? '✓' : ''}</span>
                    ${s.title}
                </button>`;
            }).join('');
            return `<div class="nav-phase">${phase.label}: ${phase.name}</div>${items}`;
        }).join('');
    }

    function renderContent() {
        const main = document.getElementById('mainContent');
        const allSections = getAllSections();
        const section = allSections.find(s => s.id === state.activeSection);
        if (!section) return;

        const phase = PROJECT_DATA.phases.find(p => p.sections.some(s => s.id === section.id));
        const isCompleted = state.completedSteps.has(section.id);

        let verifyHTML = '';
        if (section.verify && section.verify.length > 0) {
            const items = section.verify.map((v, i) => {
                const key = `${section.id}-v${i}`;
                const checked = state.checkedItems.has(key);
                return `<div class="verify-item">
                    <span class="verify-checkbox ${checked ? 'checked' : ''}"
                          onclick="toggleCheck('${key}')">${checked ? '✓' : ''}</span>
                    <span>${v}</span>
                </div>`;
            }).join('');
            verifyHTML = `<div class="verify-gate">
                <div class="verify-gate-title">✅ Verification Gate</div>
                ${items}
            </div>`;
        }

        main.innerHTML = `
            <span class="phase-badge ${phase.badge}">${phase.label}: ${phase.name}</span>
            <h1 class="page-title">${section.title}</h1>
            <div style="margin-bottom: 24px;">${section.content}</div>
            ${verifyHTML}
            <div style="margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap;">
                ${!isCompleted ?
                    `<button class="btn btn-success" onclick="markComplete('${section.id}')">✓ Mark Step Complete</button>` :
                    `<button class="btn btn-outline" onclick="markIncomplete('${section.id}')">↩ Mark Incomplete</button>`
                }
                ${getNextSection(section.id) ?
                    `<button class="btn btn-primary" onclick="navigateTo('${getNextSection(section.id).id}')">Next Step →</button>` : ''
                }
                ${getPrevSection(section.id) ?
                    `<button class="btn btn-outline" onclick="navigateTo('${getPrevSection(section.id).id}')">← Previous</button>` : ''
                }
            </div>
        `;
    }

    function getNextSection(currentId) {
        const all = getAllSections();
        const idx = all.findIndex(s => s.id === currentId);
        return idx < all.length - 1 ? all[idx + 1] : null;
    }

    function getPrevSection(currentId) {
        const all = getAllSections();
        const idx = all.findIndex(s => s.id === currentId);
        return idx > 0 ? all[idx - 1] : null;
    }

    function updateProgress() {
        const total = getAllSections().length;
        const done = state.completedSteps.size;
        const pct = Math.round((done / total) * 100);
        document.getElementById('progressCount').textContent = `${done} / ${total} steps`;
        document.getElementById('progressBarFill').style.width = pct + '%';
    }

    // ═══════════════════════════════════════════════════
    // ACTIONS
    // ═══════════════════════════════════════════════════
    function navigateTo(sectionId) {
        state.activeSection = sectionId;
        renderNav();
        renderContent();
        window.scrollTo(0, 0);
    }

    function markComplete(sectionId) {
        state.completedSteps.add(sectionId);
        saveState();
        renderNav();
        renderContent();
        updateProgress();
    }

    function markIncomplete(sectionId) {
        state.completedSteps.delete(sectionId);
        saveState();
        renderNav();
        renderContent();
        updateProgress();
    }

    function toggleCheck(key) {
        if (state.checkedItems.has(key)) {
            state.checkedItems.delete(key);
        } else {
            state.checkedItems.add(key);
        }
        saveState();
        renderContent();
    }

    function selectPattern(num) {
        state.selectedPattern = num;
        saveState();
        document.querySelectorAll('.pattern-card').forEach(c => {
            c.classList.toggle('selected', parseInt(c.dataset.pattern) === num);
        });
    }

    function copyCode(btn) {
        const block = btn.parentElement;
        const code = block.textContent.replace('Copy', '').replace('Copied!', '').trim();
        navigator.clipboard.writeText(code).then(() => {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
        });
    }

    // ═══════════════════════════════════════════════════
    // THEME TOGGLE
    // ═══════════════════════════════════════════════════
    function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
        document.getElementById('themeLabel').textContent = isDark ? 'Dark Mode' : 'Light Mode';
        try { localStorage.setItem('rag-theme', isDark ? 'dark' : 'light'); } catch(e) {}
    }

    function resetProject() {
        if (!confirm('Reset all progress? This clears completed steps, verification checks, and pattern selection. Theme preference is kept.')) return;
        state.completedSteps = new Set();
        state.checkedItems = new Set();
        state.selectedPattern = null;
        state.activeSection = 'p0-pattern';
        try { localStorage.removeItem('rag-project-state'); } catch(e) {}
        renderNav();
        renderContent();
        updateProgress();
    }

    // Restore saved theme (default: light)
    (function() {
        try {
            const saved = localStorage.getItem('rag-theme');
            if (saved === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').textContent = '🌙';
                document.getElementById('themeLabel').textContent = 'Dark Mode';
            }
        } catch(e) {}
    })();

    // ═══════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════
    renderNav();
    renderContent();
    updateProgress();
    if (state.selectedPattern) {
        setTimeout(() => {
            document.querySelectorAll('.pattern-card').forEach(c => {
                c.classList.toggle('selected', parseInt(c.dataset.pattern) === state.selectedPattern);
            });
        }, 100);
    }
    </script>
</body>
</html>
